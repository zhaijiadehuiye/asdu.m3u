name: Auto Update IPTV M3U

on:
  schedule:
    # 采用偏移分钟（避开 00/15/30/45 的 GitHub 全局排队拥堵高峰），每 15 分钟自动检测
    - cron: '7,22,37,52 * * * *'
  # 支持在 Actions 页面随时手动点击立即更新，或通过 API 触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch, clean and sync M3U
        run: |
          python3 - << 'EOF'
          import re
          import urllib.request
          from pathlib import Path

          SOURCE_URL = "https://jsnzkpg.de5.net/all.m3u"
          OUTPUT_FILE = "kanqiu.m3u"

          # 广告/引流频道过滤词（命中即整条删除）
          BLOCK_KEYWORDS = [
              "tg频道", "stymei", "jsnzkpg", "kwimgs.com", "官网",
              "免费", "公众号", "微信", "vx", "加群", "交流群", "qq群",
              "防失联", "公告", "通知", "网址", "发布页", "关注", "获取",
              "telegram", "t.me", "✈️", "☁️"
          ]

          req = urllib.request.Request(SOURCE_URL, headers={"User-Agent": "okhttp/4.12.0"})
          with urllib.request.urlopen(req, timeout=25) as resp:
              raw_text = resp.read().decode("utf-8", errors="ignore")

          if "#EXTM3U" not in raw_text:
              raise ValueError("上游返回异常，未检测到 #EXTM3U 头")

          lines = [line.strip() for line in raw_text.splitlines() if line.strip()]
          header_lines = ["#EXTM3U", "#EXT-X-APP APTV", "#EXT-X-APTV-TYPE remote"]
          live_blocks = []
          replay_blocks = []
          block = []

          for line in lines:
              if line.startswith("#EXTM3U"):
                  continue
              # 过滤掉会暴露原订阅地址的标签及重复的 APTV 头
              if line.startswith("#EXT-X-SUB-URL") or line.startswith("#EXT-X-APP"):
                  continue
              if line.startswith("#EXT-X-") and not block:
                  header_lines.append(line)
                  continue

              block.append(line)
              if not line.startswith("#"):
                  block_text = "\n".join(block)
                  block_lower = block_text.lower()
                  # 过滤包含广告/引流关键词的频道条目
                  if not any(kw.lower() in block_lower for kw in BLOCK_KEYWORDS):
                      extinf = next((l for l in block if l.startswith("#EXTINF")), "")
                      # 严格保留上游原始分组与命名，仅将赛事回放分类置于实时比赛之后
                      if 'group-title="赛事回放"' in extinf or "回放" in extinf or 'tvg-id="r' in extinf.lower():
                          replay_blocks.append(block)
                      else:
                          live_blocks.append(block)
                  block = []

          all_blocks = live_blocks + replay_blocks
          if len(all_blocks) < 5:
              raise ValueError(f"有效频道过少（{len(all_blocks)}条），放弃覆盖")

          final_lines = header_lines[:]
          for b in all_blocks:
              final_lines.extend(b)

          new_content = "\n".join(final_lines) + "\n"
          output_path = Path(OUTPUT_FILE)
          old_content = output_path.read_text(encoding="utf-8") if output_path.exists() else ""

          if new_content == old_content:
              print(f"列表内容与上游完全一致，无变化（共 {len(all_blocks)} 个频道，实时直播 {len(live_blocks)} 个，回放 {len(replay_blocks)} 个）")
          else:
              output_path.write_text(new_content, encoding="utf-8")
              print(f"成功更新 {OUTPUT_FILE}，共保留 {len(all_blocks)} 个频道（实时直播 {len(live_blocks)} 个，赛事回放 {len(replay_blocks)} 个）")
          EOF

      - name: Commit and push kanqiu.m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanqiu.m3u
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync and clean kanqiu.m3u from upstream"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "列表内容无变化，跳过提交"
          fi

      - name: Purge jsDelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/zhaijiadehuiye/asdu.m3u@main/kanqiu.m3u" || true
