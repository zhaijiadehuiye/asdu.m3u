name: Deploy Timst player shell

on:
  push:
    branches: [timst-live-tv]
    paths:
      - "player/**"
      - ".github/workflows/deploy-player.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timst-live-tv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: player
      - id: deployment
        uses: actions/deploy-pages@v4
