name: Refresh Timst live TV branch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the generated-source branch
        uses: actions/checkout@v4
        with:
          ref: timst-live-tv
          fetch-depth: 0
      - name: Refresh signed HLS URLs
        run: python3 scripts/fetch_sources.py --url https://timst.top/live-tv --timeout 20 --workers 16
      - name: Validate generated playlist
        run: |
          awk 'BEGIN { entries=0; bad=0 }
            /^#EXTINF/ { entries++; next }
            /^https?:\/\// { next }
            /^#/ { next }
            NF { bad=1 }
            END { if (bad || entries == 0) exit 1; print entries " entries" }' generated/timst.m3u
      - name: Commit refreshed playlist to the source branch
        run: |
          if git diff --quiet -- generated/timst.m3u; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/timst.m3u
          git commit -m "Refresh Timst signed HLS playlist"
          git push origin HEAD:timst-live-tv
